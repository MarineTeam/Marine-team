<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Marine Team">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="0.55" stop-color="#0284C7" />
      <stop offset="1" stop-color="#0C4A6E" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sea)" />

  <!-- Play mark: the media library half of the identity. -->
  <path
    d="M206 134 L370 220 a18 18 0 0 1 0 32 L206 338 a18 18 0 0 1 -26 -16 V150 a18 18 0 0 1 26 -16 Z"
    fill="#FFFFFF"
  />

  <!-- Single wave: legible at favicon size where a second line would blur. -->
